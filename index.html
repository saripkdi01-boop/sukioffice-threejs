<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SukiOffice Virtual — Three.js Starter</title>
<!--
  SUKIOFFICE VIRTUAL — FILE STARTER, SIAP TEMPEL KE GITHUB
  ========================================================
  CARA PAKAI DARI HP (tanpa laptop, tanpa install):
  1. Buat repo baru di github.com, misal: sukioffice-threejs (Public)
  2. Di repo itu: Add file > Upload files > upload file ini dengan nama persis: index.html
     ATAU: Add file > Create new file > nama: index.html > tempel isi file ini > Commit
  3. Buka vercel.com > Login with GitHub > Add New Project > Import repo ini
  4. Setting Vercel untuk versi statis ini:
       Framework Preset: Other
       Build Command: (kosongkan)
       Output Directory: ./
       Install Command: (kosongkan)
  5. Klik Deploy. Tunggu READY, buka link .vercel.app di HP untuk dites.
  6. Kalau repo tidak muncul di Vercel: Vercel > Configure GitHub App >
     tambahkan repo ini ke aksesnya, lalu refresh.

  NANTI, KALAU GLB ASLI SUDAH ADA:
  - Upload GLB ke repo di folder: models/SO_Lobby.glb, models/SO_Coworking.glb, dll.
  - Hapus tanda // di depan baris tryLoadGLB(...) di bawah, commit lagi.
  - Versi kotak akan otomatis disembunyikan dan diganti GLB.

  CATATAN: Jangan buka file ini langsung lewat file:// di HP.
  Harus lewat Vercel / StackBlitz / server, karena Three.js pakai modul.
-->
<style>
  body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background: #eef4f2; }
  canvas { display: block; }
  #panel {
    position: fixed; top: 10px; left: 10px; right: 10px; z-index: 10;
    background: rgba(0,0,0,0.68); color: #fff; border-radius: 12px;
    padding: 10px 12px; font-size: 14px; line-height: 1.4;
    max-width: 520px;
  }
  #panel b { font-size: 16px; }
  #panel .desc { opacity: 0.85; font-size: 13px; margin: 2px 0 8px; }
  #panel .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  #panel button {
    border: 0; border-radius: 20px; padding: 7px 12px; cursor: pointer;
    background: #ffffff; color: #111; font-weight: 600; font-size: 13px;
  }
  #panel button.active { background: #0fa3a3; color: #fff; }
  #meta { position: fixed; bottom: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.55); color: #fff; padding: 6px 10px; border-radius: 20px; font-size: 12px; }
  #hint { position: fixed; bottom: 10px; right: 10px; z-index: 10; background: rgba(0,0,0,0.55); color: #fff; padding: 6px 10px; border-radius: 20px; font-size: 12px; }
  @media (max-width: 480px) {
    #hint { display: none; }
    #panel { font-size: 13px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="panel">
  <b>SukiOffice Virtual</b>
  <div class="desc" id="roomDesc">Lobby — meja resepsionis, lounge, dan layar selamat datang.</div>
  <div class="btns">
    <button data-room="lobby" class="active" onclick="showRoom('lobby')">Lobby</button>
    <button data-room="coworking" onclick="showRoom('coworking')">Co-working</button>
    <button data-room="ceo" onclick="showRoom('ceo')">CEO</button>
    <button data-room="meeting1" onclick="showRoom('meeting1')">Meeting 1</button>
    <button data-room="meeting2" onclick="showRoom('meeting2')">Meeting 2 • Video Wall</button>
    <button data-room="huddle" onclick="showRoom('huddle')">Huddle</button>
  </div>
</div>
<div id="meta">FPS: -- • Klik objek untuk info</div>
<div id="hint">Seret = putar • Cubit/scroll = zoom</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

/* ---------- 1. Scene, Camera, Renderer ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef4f2);
scene.fog = new THREE.FogExp2(0xeef4f2, 0.012);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(8, 5, 10);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
// Kunci performa HP: pixelRatio dibatasi, jangan penuh
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.enableDamping = true;

/* ---------- 2. Cahaya ---------- */
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9a96, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(10, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -15; sun.shadow.camera.right = 15;
sun.shadow.camera.top = 15; sun.shadow.camera.bottom = -15;
scene.add(sun);

/* ---------- 3. Helper ---------- */
function box(w, h, d, color, x, y, z, opts = {}) {
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: opts.roughness ?? 0.8, metalness: opts.metalness ?? 0.1
  });
  if (opts.emissive) {
    mat.emissive = new THREE.Color(opts.emissive);
    mat.emissiveIntensity = opts.emissiveIntensity ?? 1.2;
  }
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  if (opts.name) m.name = opts.name;
  return m;
}
function cyl(rt, rb, h, color, x, y, z, opts = {}) {
  const m = new THREE.Mesh(
    new THREE.CylinderGeometry(rt, rb, h, 24),
    new THREE.MeshStandardMaterial({ color, roughness: opts.roughness ?? 0.8 })
  );
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  if (opts.name) m.name = opts.name;
  return m;
}
function floorFor(group, color = 0xdfe8e5) {
  const f = new THREE.Mesh(
    new THREE.PlaneGeometry(30, 20),
    new THREE.MeshStandardMaterial({ color, roughness: 0.4 })
  );
  f.rotation.x = -Math.PI / 2; f.receiveShadow = true;
  group.add(f);
}
function lightShaft(group, x, z) {
  // Sinar volumetrik palsu: bidang transparan, murah di HP
  const mat = new THREE.MeshBasicMaterial({
    color: 0xfff2cc, transparent: true, opacity: 0.08,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
  });
  const p = new THREE.Mesh(new THREE.PlaneGeometry(4, 9), mat);
  p.position.set(x, 4.5, z); p.rotation.z = 0.5; p.rotation.y = 0.4;
  group.add(p);
}
function plant(group, x, z) {
  group.add(cyl(0.28, 0.22, 0.5, 0x8a6b4a, x, 0.25, z));
  group.add(box(0.9, 0.9, 0.9, 0x3e7d4e, x, 1.0, z));
}

/* ---------- 4. Ruangan ---------- */
const rooms = {};
const descs = {
  lobby: 'Lobby — meja resepsionis, lounge, dan layar selamat datang.',
  coworking: 'Co-working — meja panjang, kursi ergonomis, dan sudut kolaborasi.',
  ceo: 'CEO Office — meja walnut, kursi kulit, dan rak aksen emas.',
  meeting1: 'Meeting Room 1 — meja oval untuk 8 orang, panel akustik.',
  meeting2: 'Meeting Room 2 — video wall besar untuk call & dashboard.',
  huddle: 'Huddle Room — meja bundar untuk diskusi cepat 4-6 orang.'
};
for (const key of Object.keys(descs)) rooms[key] = new THREE.Group();

// LOBBY
{
  const g = rooms.lobby; floorFor(g);
  g.add(box(4, 1.1, 1, 0xffffff, 0, 0.55, -3, { name: 'Meja Resepsionis' }));
  g.add(box(4.2, 0.08, 0.1, 0x0fa3a3, 0, 0.3, -2.45, { emissive: 0x0fa3a3, name: 'Neon Resepsionis' }));
  g.add(box(3.5, 1.2, 0.15, 0xc9a86a, 0, 2.2, -4.2, { name: 'Logo SUKIOFFICE' }));
  g.add(box(2, 0.8, 0.9, 0x2f6f6a, -4, 0.4, 2, { name: 'Sofa Lobby' }));
  g.add(box(2, 0.8, 0.9, 0xc9a86a, 4, 0.4, 2, { name: 'Sofa Lobby' }));
  plant(g, -6, -2); plant(g, 6, -2); lightShaft(g, -2, 0);
}
// CO-WORKING
{
  const g = rooms.coworking; floorFor(g, 0xe6ebe8);
  for (let i = 0; i < 3; i++) {
    const z = i * 3 - 3;
    g.add(box(4, 0.08, 1.2, 0xd9b98a, 0, 0.75, z, { name: 'Meja Co-working' }));
    g.add(box(0.6, 0.7, 0.6, 0x2f6f6a, -1.2, 0.35, z, { name: 'Kursi Ergonomis' }));
    g.add(box(0.6, 0.7, 0.6, 0x3a3a3a, 1.2, 0.35, z, { name: 'Kursi Ergonomis' }));
    g.add(box(1.6, 0.06, 0.1, 0x0fa3a3, 0, 2.2, z, { emissive: 0x0fa3a3, emissiveIntensity: 0.8 }));
  }
  plant(g, -5, 4); plant(g, 5, 4);
}
// CEO
{
  const g = rooms.ceo; floorFor(g, 0xe9e2d6);
  g.add(box(2.4, 0.08, 1.2, 0x6b4a2f, 0, 0.78, -2, { name: 'Meja CEO' }));
  g.add(box(0.7, 1.0, 0.7, 0x222222, 0, 0.5, -0.5, { name: 'Kursi CEO' }));
  g.add(box(3, 2.2, 0.4, 0x4a3220, -3.5, 1.1, -3, { name: 'Rak CEO' }));
  g.add(box(0.6, 0.08, 0.4, 0x0fa3a3, 0.8, 0.86, -2, { emissive: 0x0fa3a3, name: 'Hologram Meja CEO' }));
  lightShaft(g, 3, -1);
}
// MEETING 1
{
  const g = rooms.meeting1; floorFor(g);
  g.add(box(3.6, 0.08, 1.4, 0x6b4a2f, 0, 0.75, 0, { name: 'Meja Meeting 1' }));
  for (const [x, z] of [[-1.4, -1.2], [0, -1.2], [1.4, -1.2], [-1.4, 1.2], [0, 1.2], [1.4, 1.2]]) {
    g.add(box(0.6, 0.7, 0.6, 0x3a3a3a, x, 0.35, z, { name: 'Kursi Meeting' }));
  }
  g.add(box(2.5, 1.4, 0.1, 0xdddddd, 0, 1.8, -4, { name: 'Layar Presentasi' }));
}
// MEETING 2 — VIDEO WALL (Canvas Texture, tanpa video asli)
{
  const g = rooms.meeting2; floorFor(g, 0xe2e8ea);
  g.add(box(5, 0.08, 1.6, 0x6b4a2f, 0, 0.75, 0, { name: 'Meja Meeting 2' }));
  for (let i = -2; i <= 2; i++) {
    g.add(box(0.6, 0.7, 0.6, 0x2f6f6a, i * 1.1, 0.35, -1.4, { name: 'Kursi Meeting 2' }));
    g.add(box(0.6, 0.7, 0.6, 0x2f6f6a, i * 1.1, 0.35, 1.4, { name: 'Kursi Meeting 2' }));
  }
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#0b1f22'; ctx.fillRect(0, 0, 512, 256);
  ctx.fillStyle = '#0fa3a3'; ctx.fillRect(0, 0, 512, 36);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.fillText('SUKIOFFICE  •  VIDEO WALL', 16, 25);
  ctx.fillStyle = '#c9a86a';
  [60, 110, 80, 140, 100].forEach((h, i) => ctx.fillRect(40 + i * 70, 200 - h, 40, h));
  ctx.fillStyle = '#2f6f6a';
  for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) ctx.fillRect(330 + c * 55, 60 + r * 60, 45, 45);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(5.5, 2.4), new THREE.MeshBasicMaterial({ map: tex }));
  wall.position.set(0, 2.0, -4.5); wall.name = 'Video Wall';
  g.add(wall);
}
// HUDDLE
{
  const g = rooms.huddle; floorFor(g);
  g.add(cyl(0.9, 0.9, 0.08, 0xd9b98a, 0, 0.75, 0, { name: 'Meja Bundar Huddle' }));
  g.add(cyl(0.15, 0.3, 0.75, 0x3a3a3a, 0, 0.37, 0));
  for (const [x, z] of [[-1.3, 0], [1.3, 0], [0, -1.3], [0, 1.3]]) {
    g.add(box(0.6, 0.7, 0.6, 0x2f6f6a, x, 0.35, z, { name: 'Kursi Huddle' }));
  }
  g.add(box(2.2, 1.4, 0.08, 0xffffff, 0, 1.6, -3, { name: 'Kaca Tulis Huddle' }));
}

for (const g of Object.values(rooms)) scene.add(g);

/* ---------- 5. Ganti ruangan ---------- */
window.showRoom = (name) => {
  for (const [key, g] of Object.entries(rooms)) g.visible = (key === name);
  document.getElementById('roomDesc').textContent = descs[name] || '';
  document.querySelectorAll('#panel button').forEach(b => {
    b.classList.toggle('active', b.dataset.room === name);
  });
  camera.position.set(8, 5, 10);
  controls.target.set(0, 1, 0);
};
showRoom('lobby');

/* ---------- 6. Klik objek = info ---------- */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (e) => {
  mouse.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(mouse, camera);
  const hit = raycaster.intersectObjects(scene.children, true)[0];
  if (hit && hit.object.name) {
    document.getElementById('meta').textContent = 'Kamu klik: ' + hit.object.name;
  }
});

/* ---------- 7. GLB opsional — hapus // kalau GLB sudah diupload ---------- */
function tryLoadGLB(roomKey, path) {
  const draco = new DRACOLoader();
  draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
  const loader = new GLTFLoader();
  loader.setDRACOLoader(draco);
  loader.load(path, (gltf) => {
    const model = gltf.scene;
    model.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    rooms[roomKey].visible = false;
    scene.add(model);
  }, undefined, () => {
    console.warn('GLB belum ada, pakai versi kotak:', path);
  });
}
// tryLoadGLB('lobby', 'models/SO_Lobby.glb');
// tryLoadGLB('coworking', 'models/SO_Coworking.glb');
// tryLoadGLB('ceo', 'models/SO_CEO.glb');
// tryLoadGLB('meeting1', 'models/SO_Meeting1.glb');
// tryLoadGLB('meeting2', 'models/SO_Meeting2.glb');

/* ---------- 8. Loop, FPS, Resize ---------- */
let frames = 0, lastFpsTime = performance.now();
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  frames++;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) {
    document.getElementById('meta').textContent =
      'FPS: ' + frames + ' • Draw calls: ' + renderer.info.render.calls + ' • Klik objek untuk info';
    frames = 0; lastFpsTime = now;
  }
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
